<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Brack Indumentaria</title>
<script>
  // El demo estático usa hash routing: /demos/brack/panel → /demos/brack/#/panel.
  // Este stub existe para que el link "sin numeral" funcione igual (mails, tipeo a mano).
  var m = location.pathname.match(/(panel|ingresar|mayorista|tienda|service|carrito)\/?$/);
  var base = location.pathname.replace(/(panel|ingresar|mayorista|tienda|service|carrito)\/?$/, "");
  location.replace(base + "#/" + (m ? m[1] : ""));
</script>
</html>
