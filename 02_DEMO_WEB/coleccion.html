<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>if(location.pathname.endsWith('/demos/brack')){location.replace(location.pathname+'/'+location.search+location.hash);}</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex, nofollow">
<title>El catálogo — Brack Indumentaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tema.css">
<!-- sin defer: pinta el tema guardado antes del primer frame, si no el
     catalogo entra en blanco y recien despues se apaga -->
<script src="assets/tema.js"></script>
<style>
/* La paleta y el modo noche viven en assets/tema.css, compartidos con
   index.html. Acá abajo solo van los estilos propios del catálogo. */
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:100;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
padding:1rem 3vw;background:rgba(var(--nav-rgb),.92);backdrop-filter:blur(14px);border-bottom:var(--hairline)}
.top-back{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-60)}
.top-back:hover{color:var(--ink)}
.top-brand{font-family:var(--serif);letter-spacing:.28em;font-size:1rem;text-align:center}
.top-brand small{display:block;font-size:.5rem;letter-spacing:.5em;color:var(--gold);margin-top:.15rem}
.top-right{justify-self:end;display:flex;align-items:center;gap:.4rem}
.top-wa{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);
color:var(--white);padding:.65rem 1.3rem;border-radius:3rem}
.top-wa:hover{background:var(--ink)}
.head{padding:7vh 3vw 3vh;display:flex;align-items:baseline;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.head h1{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,4vw,3.2rem)}
.head .count{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.shop{display:grid;grid-template-columns:230px 1fr;gap:2.5rem;padding:0 3vw 10vh;align-items:start}
.menu{position:sticky;top:5.4rem;background:var(--white);border:var(--hairline);border-radius:1.2rem;padding:1.4rem 0;overflow:hidden}
.menu .t{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-35);padding:0 1.4rem 1rem}
.menu button{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:left;padding:.55rem 1.4rem;
font-size:.85rem;color:var(--ink-60);transition:all .25s}
.menu button:hover{color:var(--ink);background:rgba(var(--line-rgb),.04)}
.menu button.on{color:var(--gold-deep);background:rgba(var(--line-rgb),.07);font-weight:500}
.menu button span{font-family:var(--mono);font-size:.62rem;color:var(--ink-35);padding-top:.2rem}
.tools{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1.6rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;flex-basis:100%}
.chip span{font-family:var(--mono);font-size:.58rem;color:var(--ink-35);margin-left:.35rem}
.search{flex:1;min-width:12rem;background:var(--white);border:var(--hairline);border-radius:3rem;padding:.7rem 1.2rem;
font-family:var(--sans);font-size:.85rem;outline:none}
.search:focus{border-color:var(--gold)}
.chip{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);border:var(--hairline);
padding:.6rem 1.1rem;border-radius:3rem;background:var(--white);transition:all .25s}
.chip.on{border-color:var(--gold);color:var(--gold-deep);background:rgba(var(--line-rgb),.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.3rem}
.card{background:rgba(var(--surface-rgb),.65);backdrop-filter:blur(16px);border:1px solid rgba(var(--surface-rgb),.8);
border-radius:1.3rem;overflow:hidden;cursor:pointer;box-shadow:var(--halo-cat),0 6px 24px rgba(var(--shadow-rgb),.05);
transition:transform .45s var(--ease),box-shadow .45s var(--ease),opacity .45s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:var(--halo-cat),0 18px 40px rgba(var(--shadow-rgb),.1)}
.card .im{aspect-ratio:1/1;overflow:hidden;background:linear-gradient(170deg,var(--ph-a),var(--ph-b))}
.card .im img{width:100%;height:100%;object-fit:cover;filter:saturate(.94);transition:transform .7s var(--ease)}
.card:hover .im img{transform:scale(1.04)}
.card .in{padding:.9rem 1.1rem 1.1rem}
.card .b{font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-35)}
.card .m{font-family:var(--serif);font-size:1.02rem;margin-top:.2rem}
.card .r{font-family:var(--mono);font-size:.6rem;color:var(--gold-deep);margin-top:.45rem}
.empty{padding:6vh 0;text-align:center;color:var(--ink-60);font-size:.85rem;display:none}
.ficha{position:fixed;inset:0;z-index:250;display:none;background:rgba(var(--shadow-rgb),.45);backdrop-filter:blur(8px)}
.ficha.open{display:flex}
.panel{margin:auto;width:min(980px,94vw);max-height:92svh;background:var(--white);border-radius:1.2rem;
display:grid;grid-template-columns:6fr 5fr;overflow:hidden;box-shadow:0 40px 120px rgba(var(--shadow-rgb),.45)}
.gal{background:linear-gradient(165deg,var(--ph-a),var(--ph-b));display:flex;flex-direction:column;position:relative}
.gal .main{flex:1;display:flex;align-items:center;justify-content:center;padding:2.4rem}
.gal .main img{max-width:100%;max-height:52svh;object-fit:contain}
.thumbs{display:flex;gap:.5rem;padding:0 1.5rem 1.5rem;justify-content:center;overflow-x:auto}
.thumbs img{width:52px;aspect-ratio:1;object-fit:cover;border-radius:.4rem;border:1px solid transparent;cursor:pointer;opacity:.55}
.thumbs img.on{border-color:var(--gold);opacity:1}
.info{padding:2.6rem 2.2rem;overflow-y:auto}
.lote{font-family:var(--mono);font-size:.6rem;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.brand{font-family:var(--serif);font-weight:300;font-size:2.2rem;margin-top:.7rem;line-height:1.05}
.model{font-family:var(--serif);font-style:italic;color:var(--ink-60);font-size:1.2rem;margin-top:.2rem}
.specs{margin-top:1.8rem;border-top:var(--hairline)}
.row{display:flex;justify-content:space-between;padding:.7rem 0;border-bottom:var(--hairline);
font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
.row .k{color:var(--ink-35)}
.range{margin-top:1.6rem;font-family:var(--mono);font-size:.68rem;color:var(--gold-deep)}
.ctas{margin-top:1.8rem;display:flex;flex-direction:column;gap:.7rem}
.btn{text-align:center;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;padding:.95rem 1.4rem;border-radius:3rem}
.btn-b{background:var(--gold);color:var(--white)}.btn-b:hover{background:var(--ink)}
.btn-l{border:1px solid rgba(var(--line-rgb),.22)}.btn-l:hover{border-color:var(--gold);color:var(--gold-deep)}
.close{position:absolute;top:1rem;right:1rem;z-index:5;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
color:var(--ink-60);background:rgba(var(--chip-rgb),.92);border-radius:2rem;padding:.5rem 1rem}
@media(max-width:900px){
  /* min-width:0 en los hijos: sin eso, el menú en nowrap le impone su ancho
     mínimo de contenido a la columna del grid y la página entera se va a 2224px
     de ancho —medido: 676px de desborde en un iPhone 12—. Un track 1fr no baja
     de min-content salvo que se le diga. */
  .shop{grid-template-columns:minmax(0,1fr)}
  .shop > *{min-width:0}
  /* el menú de marcas se vuelve una tira que se desliza, en vez de envolver en
     varias filas de chips que empujan la grilla fuera de la primera pantalla */
  .menu{position:static;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:.4rem;padding:.7rem;
    border-radius:1rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .menu::-webkit-scrollbar{display:none}
  .menu .t{display:none}
  .menu button{width:auto;flex:0 0 auto;white-space:nowrap;border:var(--hairline);border-radius:2rem;
    padding:.7rem 1rem;font-size:.8rem;min-height:44px}
  .menu button span{display:none}
  .panel{grid-template-columns:1fr;display:block;overflow-y:auto}
  .gal .main img{max-height:40svh}

  /* ===== toque y tipografía, medidos en 390 / 360 / 430 ===== */
  .top{padding:.7rem 3vw}
  .top-back{min-height:44px;display:flex;align-items:center;font-size:.78rem}
  .top-brand{font-size:.86rem;min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .top-brand small{display:none}      /* iba en 8px: ilegible en la mano */
  .top-wa{min-height:44px;display:flex;align-items:center;font-size:.76rem;padding:.65rem 1.1rem}
  .nite{padding:.7rem;min-width:44px;min-height:44px;justify-content:center}
  .nite-dot{width:9px;height:9px}
  .chips{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:.2rem}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;font-size:.74rem}
  .chip span{font-size:.66rem}
  .search{min-height:48px;font-size:16px}   /* 16px: menos de eso, iOS hace zoom al enfocar */
  .head .count{font-size:.78rem}
  .card .b{font-size:.74rem}
  .menu button span{font-size:.7rem}
  .card .m{font-size:1.06rem}
  .card .r{font-size:.76rem}
  .row{font-size:.7rem}
  .lote{font-size:.68rem}
  .btn{min-height:48px;display:flex;align-items:center;justify-content:center;font-size:.74rem}
  .close{min-height:44px;display:flex;align-items:center;font-size:.68rem}
  .thumbs img{width:60px}

  /* Dos columnas. Con auto-fill y un mínimo de 230px, en 390px entraba UNA sola
     card gigante: para recorrer 119 productos eso es un scroll eterno. De a dos
     se ve el doble por pantalla y la foto sigue siendo grande. */
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
  .card{border-radius:1rem}
  .card .in{padding:.7rem .8rem .9rem}
  .card .m{font-size:.94rem;line-height:1.25}
  /* la cabecera ocupaba media pantalla antes de la primera prenda */
  .head{padding:3.4vh 3vw 2vh}
  .tools{margin-bottom:1rem;gap:.5rem}
}
@media(max-width:400px){
  .grid{gap:.55rem}
  .card .m{font-size:.88rem}
}
</style>
</head>
<body>
<header class="top">
  <a class="top-back" href="index.html">← Inicio</a>
  <a class="top-brand" href="index.html">BRACK<small>EL CATÁLOGO</small></a>
  <div class="top-right">
    <button class="nite" id="niteBtn" type="button" aria-pressed="false" aria-label="Modo noche">
      <span class="nite-dot" aria-hidden="true"></span><span class="nite-txt">Noche</span>
    </button>
    <a class="top-wa" href="https://wa.me/5492954517938?text=Hola%2C%20quisiera%20consultar%20por%20una%20prenda%20del%20cat%C3%A1logo." target="_blank" rel="noopener">WhatsApp</a>
  </div>
</header>
<div class="head"><h1>La Colección</h1><span class="count" id="count"></span></div>
<div class="shop">
  <aside class="menu" id="menu"><div class="t">Marcas</div></aside>
  <main>
    <div class="tools">
      <input class="search" id="q" type="text" placeholder="Buscar marca o modelo…">
      <div class="chips" id="chips"></div>
      <!-- se llenan desde el catálogo: las categorías reales, con su conteo -->
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">No hay nada con ese criterio. El stock rota todos los días — escribinos por WhatsApp y te decimos qué quedó.</div>
  </main>
</div>
<div class="ficha" id="ficha">
  <div class="panel">
    <div class="gal">
      <button class="close" id="close">Cerrar ✕</button>
      <div class="main"><img id="fImg" alt=""></div>
      <div class="thumbs" id="fThumbs"></div>
    </div>
    <div class="info">
      <span class="lote" id="fLote"></span>
      <h2 class="brand" id="fBrand"></h2>
      <p class="model" id="fModel"></p>
      <div class="specs" id="fSpecs"></div>
      <p class="range" id="fRange"></p>
      <div class="ctas">
        <a class="btn btn-b" id="fWA" target="_blank" rel="noopener">Consultar por esta prenda</a>
        <a class="btn btn-l" href="https://wa.me/5492954517938?text=Hola%2C%20quisiera%20coordinar%20una%20visita%20privada." target="_blank" rel="noopener">Agendar visita privada</a>
      </div>
    </div>
  </div>
</div>
<script src="assets/formato.js"></script>
<script src="data/catalogo.js"></script>
<script>
(function(){
"use strict";
const DATA = (window.CATALOGO||[]).slice().sort((a,b)=>a.brand.localeCompare(b.brand)||a.model.localeCompare(b.model));
const st = {q:'',brand:'',cond:''};
const grid = document.getElementById('grid');
const menu = document.getElementById('menu');
const counts = {};
DATA.forEach(d=>counts[d.brand]=(counts[d.brand]||0)+1);
const mkBtn=(label,val,n)=>{
  const b=document.createElement('button');
  b.innerHTML=label+(n!=null?' <span>'+n+'</span>':'');
  b.addEventListener('click',()=>{st.brand=val;menu.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();});
  return b;
};
const all=mkBtn('Todas las marcas','',DATA.length);all.classList.add('on');menu.appendChild(all);
Object.keys(counts).sort().forEach(br=>menu.appendChild(mkBtn(br,br,counts[br])));
/* el precio lo formatea BRACK.precio (assets/formato.js), en un solo lugar */
function rl(r){return BRACK.precio(r)}
function render(){
  const list=DATA.filter(d=>{
    if(st.brand&&d.brand!==st.brand)return false;
    if(st.cond&&d.cond!==st.cond)return false;
    if(st.q&&!(d.brand+' '+d.model).toLowerCase().includes(st.q.toLowerCase()))return false;
    return true;
  });
  document.getElementById('count').textContent=list.length+' de '+DATA.length+' productos';
  document.getElementById('empty').style.display=list.length?'none':'block';
  /* La grilla pide fotos/thumb/: son las mismas fotos a 380px, que es el tamaño
   real al que se ven en la cuadrícula. Recorrer el catálogo entero en un
   teléfono bajaba 9,94 MB de imágenes; con las miniaturas son 1,96 MB. La ficha
   sigue abriendo la foto grande. */
grid.innerHTML=list.map(d=>'<article class="card" data-id="'+d.id+'"><div class="im"><img loading="lazy" decoding="async" src="fotos/thumb/'+d.photos[0]+'" alt="'+d.brand+' '+d.model+'"></div><div class="in"><div class="b">'+d.brand+'</div><div class="m">'+d.model+'</div><div class="r">'+rl(d.range)+'</div></div></article>').join('');
}
render();
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value.trim();render();});
/* Los chips salen del catálogo, no de una lista escrita a mano. Los que había
   —"Nuevo / Como nuevo / Usado"— filtraban por d.cond creyendo que era una
   condición de reventa; en Brack ese campo guarda la CATEGORÍA, así que
   ninguno de los tres valores existía y clickear cualquiera vaciaba la grilla. */
const chips = document.getElementById('chips');
const porCat = {};
DATA.forEach(d=>{ if(d.cond) porCat[d.cond]=(porCat[d.cond]||0)+1; });
const mkChip=(label,val,n)=>{
  const b=document.createElement('button');
  b.className='chip';
  b.dataset.v=val;
  b.innerHTML=label+(n!=null?'<span>'+n+'</span>':'');
  b.addEventListener('click',()=>{
    chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');st.cond=val;render();
  });
  return b;
};
const todas=mkChip('Todas','',DATA.length);todas.classList.add('on');chips.appendChild(todas);
Object.keys(porCat).sort().forEach(c=>chips.appendChild(mkChip(c,c,porCat[c])));
const ficha=document.getElementById('ficha');
grid.addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c)return;
  const d=DATA.find(x=>x.id===c.dataset.id);if(!d)return;
  const idx=String(DATA.indexOf(d)+1).padStart(3,'0');
  document.getElementById('fLote').textContent='Referencia '+idx;
  document.getElementById('fBrand').textContent=d.brand;
  document.getElementById('fModel').textContent=d.model;
  document.getElementById('fSpecs').innerHTML=BRACK.specs(d).map(s=>'<div class="row"><span class="k">'+s[0]+'</span><span>'+s[1]+'</span></div>').join('');
  document.getElementById('fRange').textContent=BRACK.precioCompleto(d.range);
  document.getElementById('fWA').href='https://wa.me/5492954517938?text='+encodeURIComponent('Hola, vi '+d.brand+' '+d.model+' (Ref '+idx+') en el catálogo y quisiera consultar por ella.');
  const main=document.getElementById('fImg'),th=document.getElementById('fThumbs');
  main.src='fotos/'+d.photos[0];
  th.innerHTML=d.photos.map((p,i)=>'<img src="fotos/'+p+'" class="'+(i===0?'on':'')+'" data-p="'+p+'">').join('');
  th.onclick=ev=>{const t=ev.target.closest('img[data-p]');if(!t)return;main.src='fotos/'+t.dataset.p;th.querySelectorAll('img').forEach(x=>x.classList.remove('on'));t.classList.add('on');};
  ficha.classList.add('open');document.body.style.overflow='hidden';
});
const closeF=()=>{ficha.classList.remove('open');document.body.style.overflow='';};
document.getElementById('close').addEventListener('click',closeF);
ficha.addEventListener('click',e=>{if(e.target===ficha)closeF();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeF();});
})();
</script>
</body>
</html>
