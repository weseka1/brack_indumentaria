<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRACK — Panel de la tienda</title>
<meta name="robots" content="noindex">
<!--
  Esta ruta servía el panel de gestión de OTRO cliente (Islas Group), copiado
  entero junto con el esqueleto de la demo y publicado sin que nadie lo linkeara.
  El panel real de Brack es el React que vive en /panel/.

  No se borra el archivo y ya: Cloudflare lo tenía cacheado (s-maxage=300) y
  seguía sirviendo el contenido viejo aunque el archivo no estuviera en el repo.
  Publicar acá una redirección cambia el ETag —así el edge revalida— y de paso
  cualquier link viejo termina en el panel correcto en vez de en un 404.
-->
<meta http-equiv="refresh" content="0; url=./panel/">
<link rel="canonical" href="./panel/">
<script>location.replace('./panel/' + location.search + location.hash);</script>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#F6F7F8;color:#111214;
       font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:inherit}
</style>
</head>
<body>
  <p>Llevándote al panel de Brack… <a href="./panel/">entrar ahora</a>.</p>
</body>
</html>
